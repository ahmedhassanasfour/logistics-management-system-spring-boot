# ==============================================================
# Production Profile Overrides (SPRING_PROFILES_ACTIVE=prod)
# ==============================================================

# Strict DDL validation in production: never auto-modify schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production pool tuning
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}

# Actuator health details hidden from unauthenticated viewers in production
management.endpoint.health.show-details=never

# Production logging levels
logging.level.root=${LOGGING_LEVEL_ROOT:WARN}
logging.level.com.ahmed.logistics=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:WARN}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:WARN}
