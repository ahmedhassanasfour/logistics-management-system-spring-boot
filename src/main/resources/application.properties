spring.application.name=Logistics
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ===============================
# Profile Configuration
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# Database (PostgreSQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:${POSTGRES_HOST:localhost}}:${DB_PORT:${POSTGRES_PORT:5432}}/${DB_NAME:${POSTGRES_DB:logistics_db}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${POSTGRES_USER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# HikariCP Connection Pool
# ===============================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.pool-name=LogisticsHikariCP

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:${SPRING_JPA_HIBERNATE_DDL_AUTO:update}}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# ===============================
# Redis & Cache
# ===============================
spring.data.redis.host=${REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
spring.data.redis.port=${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:2000ms}
spring.cache.type=redis
spring.cache.redis.time-to-live=${REDIS_CACHE_TTL:10m}
spring.cache.redis.cache-null-values=false

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.mail.enabled=false
management.info.env.enabled=false
info.app.name=${spring.application.name:Logistics}
info.app.description=Logistics Management System API
info.app.version=1.0.0

# ===============================
# SpringDoc / OpenAPI Swagger UI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===============================
# CORS Configuration
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.cors.allowed-origin:http://localhost:3000}}

# ===============================
# JWT Configuration
# ===============================
# In production, JWT_SECRET must be supplied via environment variable (minimum 256 bits).
# The fallback below is strictly for local development and testing.
jwt.secret=${JWT_SECRET:c2VjdXJlLWxvZ2lzdGljcy1qd3Qtc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmctZm9yLWhzMjU2}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION_MS:${JWT_ACCESS_EXPIRATION:900000}}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION_MS:${JWT_REFRESH_EXPIRATION:604800000}}

# ===============================
# Mail Configuration
# ===============================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:noreply@logistics.com}
app.mail.enabled=${MAIL_ENABLED:true}

# ===============================
# Async / Thread Pool Configuration
# ===============================
app.async.core-pool-size=${ASYNC_CORE_POOL_SIZE:5}
app.async.max-pool-size=${ASYNC_MAX_POOL_SIZE:20}
app.async.queue-capacity=${ASYNC_QUEUE_CAPACITY:100}
app.async.thread-name-prefix=${ASYNC_THREAD_NAME_PREFIX:logistics-async-}
app.async.await-termination-seconds=${ASYNC_AWAIT_TERMINATION_SECONDS:30}

# ===============================
# Geo / Routing Configuration
# ===============================
app.geo.nominatim.base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
app.geo.nominatim.user-agent=${NOMINATIM_USER_AGENT:AhmedLogistics/1.0}
app.geo.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
app.geo.connect-timeout-ms=${GEO_CONNECT_TIMEOUT_MS:5000}
app.geo.read-timeout-ms=${GEO_READ_TIMEOUT_MS:5000}

# ===============================
# Pricing Configuration
# ===============================
app.pricing.distance-rate-per-km=${DISTANCE_RATE_PER_KM:1.50}

# ===============================
# Logging Configuration
# ===============================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.ahmed.logistics=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
